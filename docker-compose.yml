version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api-core

  api-core:
    build:
      context: ./apps/api-core
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api-core:/app
    environment:
      - ENV=development
